name: Build Windows

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Node)
        run: npm install

      - name: Check DOM event bindings
        run: npm run check:dom-events

      - name: Rust check
        run: npm run check:rust

      - name: Rust tests
        run: npm run test:rust

      - name: Get version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename Artifacts and Extract Signature (Windows)
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $os = "win64"

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $newNameInstaller = "Pulsar-$ver-$os.exe"
          Copy-Item $installer.FullName -Destination $newNameInstaller

          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          Copy-Item $sigFile.FullName -Destination "Pulsar-win64.sig"

          $exe = "src-tauri/target/release/pulsar.exe"
          $newNameZip = "Pulsar-$ver-$os.zip"
          Compress-Archive -Path $exe -DestinationPath $newNameZip

          echo "ASSET_INSTALLER=$newNameInstaller" >> $env:GITHUB_ENV
          echo "ASSET_PORTABLE=$newNameZip" >> $env:GITHUB_ENV
          echo "ASSET_SIG=Pulsar-win64.sig" >> $env:GITHUB_ENV

      - name: Upload build artifacts (server)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}

      - name: Upload Signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: sig-windows
          path: ${{ env.ASSET_SIG }}

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}
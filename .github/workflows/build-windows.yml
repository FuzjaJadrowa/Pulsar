name: Build Windows

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Node)
        run: npm install

      - name: Get version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Prepare signing key
        shell: pwsh
        env:
          TAURI_KEY_CONTENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_KEY_CONTENT) { throw "TAURI_SIGNING_PRIVATE_KEY not found in GitHub Secrets" }
          
          $keyPath = Join-Path $env:GITHUB_WORKSPACE "tauri-signing.key"
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_KEY_CONTENT)
          
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename Artifacts (Windows)
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $os = "win64"

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $newNameInstaller = "Pulsar-$ver-$os.exe"
          Copy-Item $installer.FullName -Destination $newNameInstaller

          $exe = "src-tauri/target/release/pulsar.exe"
          $newNameZip = "Pulsar-$ver-$os.zip"
          Compress-Archive -Path $exe -DestinationPath $newNameZip

          echo "ASSET_INSTALLER=$newNameInstaller" >> $env:GITHUB_ENV
          echo "ASSET_PORTABLE=$newNameZip" >> $env:GITHUB_ENV

      - name: Upload build artifacts (server)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}

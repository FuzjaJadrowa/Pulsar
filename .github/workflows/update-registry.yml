name: Update Registry

on:
  workflow_run:
    workflows: ["Build Apps"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: update-registry-master
  cancel-in-progress: false

jobs:
  update-registry:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Determine tag for this run
        id: tag
        shell: bash
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep '^v' | sort -V | tail -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "No v* tag for this workflow_run; skipping update registry."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS signature
        if: steps.tag.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          path: sigs
          name: sig-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Windows signature
        if: steps.tag.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          path: sigs
          name: sig-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run finalize-update script
        if: steps.tag.outputs.should_run == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/finalize-update.js

      - name: Commit and push update.json
        if: steps.tag.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update signatures in update.json for release ${{ steps.tag.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master
          git push origin master
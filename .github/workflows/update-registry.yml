name: Update Registry

on:
  workflow_run:
    workflows: ["Build Linux", "Build macOS", "Build Windows"]
    types:
      - completed
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  update-registry:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Determine tag for this run
        id: tag
        shell: bash
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep '^v' | head -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "No v* tag for this workflow_run; skipping update registry."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Find build runs for this tag
        id: runs
        if: steps.tag.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = "${{ github.event.workflow_run.head_sha }}";
            const workflows = [
              "build-linux.yml",
              "build-macos.yml",
              "build-windows.yml"
            ];
            const runIds = {};
            for (const wf of workflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                per_page: 50
              });
              const run = data.workflow_runs.find(r => r.head_sha === headSha && r.conclusion === "success");
              if (!run) {
                core.info(`No successful run found for ${wf} and ${headSha}.`);
                core.setOutput("all_found", "false");
                return;
              }
              runIds[wf] = run.id;
            }
            core.setOutput("all_found", "true");
            core.setOutput("linux_run_id", runIds["build-linux.yml"]);
            core.setOutput("macos_run_id", runIds["build-macos.yml"]);
            core.setOutput("windows_run_id", runIds["build-windows.yml"]);

      - name: Download Linux signature
        if: steps.runs.outputs.all_found == 'true'
        uses: actions/download-artifact@v4
        with:
          path: sigs
          name: sig-linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.linux_run_id }}

      - name: Download macOS signature
        if: steps.runs.outputs.all_found == 'true'
        uses: actions/download-artifact@v4
        with:
          path: sigs
          name: sig-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.macos_run_id }}

      - name: Download Windows signature
        if: steps.runs.outputs.all_found == 'true'
        uses: actions/download-artifact@v4
        with:
          path: sigs
          name: sig-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.windows_run_id }}

      - name: Run finalize-update script
        if: steps.runs.outputs.all_found == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          VERSION=$VERSION node scripts/finalize-update.js

      - name: Commit and push update.json
        if: steps.runs.outputs.all_found == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update signatures in update.json for release ${{ steps.tag.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git push origin master
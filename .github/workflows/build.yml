name: Build

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu-verify-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ubuntu-verify-cargo-
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            args: ''
            dist: ''
            signature: true
          - runner: macos-latest
            platform: macos
            args: --target aarch64-apple-darwin
            dist: ''
            signature: true
          - runner: ubuntu-22.04
            platform: linux
            args: ''
            dist: deb
            signature: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS build target
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform }}-cargo-
      - run: npm ci
      - name: Get version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PULSAR_DIST: ${{ matrix.dist }}
        with:
          args: ${{ matrix.args }}
      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $installerName = "Pulsar-$ver-win64.exe"
          Copy-Item $installer.FullName -Destination $installerName
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          Copy-Item $sigFile.FullName -Destination "Pulsar-win64.sig"
          $portableName = "Pulsar-$ver-win64.zip"
          Compress-Archive -Path "src-tauri/target/release/pulsar.exe" -DestinationPath $portableName
          "ASSET_INSTALLER=$installerName" >> $env:GITHUB_ENV
          "ASSET_PORTABLE=$portableName" >> $env:GITHUB_ENV
          "ASSET_SIG=Pulsar-win64.sig" >> $env:GITHUB_ENV
      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ver="${{ env.VERSION }}"
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Pulsar.app"
          pkg_name="Pulsar-$ver-MacOS.pkg"
          mkdir -p pkg-resources
          cp public/assets/icons/icon.icns pkg-resources/Icon.icns
          textutil -convert rtf LICENSE -output pkg-resources/License.rtf
          productbuild --component "$app_path" /Applications --resources pkg-resources "$pkg_name"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz "Pulsar-$ver-MacOS.app.tar.gz"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig Pulsar-MacOS.sig
          echo "ASSET_INSTALLER=$pkg_name" >> "$GITHUB_ENV"
          echo "ASSET_UPDATER=Pulsar-$ver-MacOS.app.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SIG=Pulsar-MacOS.sig" >> "$GITHUB_ENV"
      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          asset="Pulsar-${{ env.VERSION }}-Linux.deb"
          cp src-tauri/target/release/bundle/deb/*.deb "$asset"
          echo "ASSET_DEB=$asset" >> "$GITHUB_ENV"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}
            ${{ env.ASSET_UPDATER }}
            ${{ env.ASSET_DEB }}
      - name: Upload signature artifact
        if: matrix.signature
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.platform }}
          path: ${{ env.ASSET_SIG }}
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            ${{ env.ASSET_INSTALLER }}
            ${{ env.ASSET_PORTABLE }}
            ${{ env.ASSET_UPDATER }}
            ${{ env.ASSET_DEB }}
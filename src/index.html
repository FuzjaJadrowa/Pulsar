<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsar</title>
    <link rel="stylesheet" href="assets/stylesheets/global.css" />
    <link rel="stylesheet" href="assets/stylesheets/settings.css" />
    <link rel="stylesheet" href="assets/stylesheets/splash.css" />
    <link rel="stylesheet" href="assets/stylesheets/notifications.css" />
    <link rel="stylesheet" href="assets/stylesheets/queue.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Montserrat:wght@800&display=swap" />
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <h2 id="splash-status">Starting...</h2>
        <p id="splash-progress"></p>

        <button id="splash-skip-btn" class="skip-btn" style="display: none;">
            Skip Update
        </button>
    </div>
</div>

<div id="notification-container"></div>

<div id="titlebar" data-tauri-drag-region>
    <img src="assets/icons/icon_full.png" class="logo" alt="Pulsar Logo" />

    <button class="nav-btn expandable" onclick="loadPage('downloader', 0)" id="nav-downloader">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Downloader</span>
    </button>

    <div style="flex-grow: 1;"></div>

    <button class="nav-btn" onclick="loadPage('settings', 1)" id="nav-settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" fill="none"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h0A1.65 1.65 0 0 0 9.93 3.1V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Settings</span>
    </button>

    <button class="nav-btn expandable" onclick="toggleQueue()" id="btn-queue">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <circle cx="4" cy="6" r="1"></circle>
            <circle cx="4" cy="12" r="1"></circle>
            <circle cx="4" cy="18" r="1"></circle>
        </svg>
        <span>Queue</span>
    </button>

    <div class="window-controls">
        <button class="control-btn" id="minimize-btn"><svg width="12" height="12" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="control-btn" id="maximize-btn"><svg width="12" height="12" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <button class="control-btn close" id="close-btn"><svg width="12" height="12" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
</div>

<div id="content-area"></div>

<div id="queue-panel" style="display: none;"></div>

<script src="assets/scripts/notifications.js"></script>
<script src="assets/scripts/queue.js"></script>
<script src="assets/scripts/main.js"></script>
<link rel="stylesheet" href="assets/stylesheets/downloader.css">
</body>
</html>

<div class="page-root downloader-page">

  <div class="page-scroll downloader-scroll">

    <div id="search-section" class="search-section centered">
      <div class="search-box-row">
        <input type="text" id="url-input" placeholder="Type something to download..." data-i18n-placeholder="downloader.search.urlPlaceholder" autocomplete="off">
        <span id="paste-icon" class="paste-icon bar-icon" title="Paste from clipboard" data-i18n-title="downloader.search.pasteTitle" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="4" rx="1"></rect>
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
          </svg>
        </span>
        <button id="fetch-btn" class="bar-action">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
      <div id="search-provider-panel" class="search-provider-panel" aria-hidden="true">
        <span class="provider-label" data-i18n="downloader.search.providerLabel">Search on</span>
        <div class="provider-buttons">
          <button type="button" class="provider-btn active" data-prefix="ytsearch10" aria-pressed="true">
            <svg class="provider-icon youtube-icon" viewBox="0 0 28.57 20" aria-hidden="true">
              <path d="M27.9727 3.12324C27.6435 1.89323 26.6768 0.926623 25.4468 0.597366C23.2197 2.24288e-07 14.285 0 14.285 0C14.285 0 5.35042 2.24288e-07 3.12323 0.597366C1.89323 0.926623 0.926623 1.89323 0.597366 3.12324C2.24288e-07 5.35042 0 10 0 10C0 10 2.24288e-07 14.6496 0.597366 16.8768C0.926623 18.1068 1.89323 19.0734 3.12323 19.4026C5.35042 20 14.285 20 14.285 20C14.285 20 23.2197 20 25.4468 19.4026C26.6768 19.0734 27.6435 18.1068 27.9727 16.8768C28.5701 14.6496 28.5701 10 28.5701 10C28.5701 10 28.5677 5.35042 27.9727 3.12324Z"/>
              <path d="M11.4253 14.2854L18.8477 10.0004L11.4253 5.71533V14.2854Z"/>
            </svg>
            <span>YouTube</span>
          </button>
          <button type="button" class="provider-btn" data-prefix="ytmsearch10" aria-pressed="false">
            <svg class="provider-icon ytmusic-icon" viewBox="0 0 176 176" aria-hidden="true">
              <circle cx="88" cy="88" r="88"/>
              <path d="M88,46c23.1,0,42,18.8,42,42s-18.8,42-42,42s-42-18.8-42-42S64.9,46,88,46 M88,42c-25.4,0-46,20.6-46,46s20.6,46,46,46s46-20.6,46-46S113.4,42,88,42L88,42z"/>
              <polygon points="72,111 111,87 72,65"/>
            </svg>
            <span>YouTube Music</span>
          </button>
          <button type="button" class="provider-btn" data-prefix="scsearch10" aria-pressed="false">
            <svg class="provider-icon soundcloud-icon" viewBox="0 0 2499.998 1386.695" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path d="M0 1137.737c0 31.024 11.247 54.481 33.737 70.382 22.491 15.898 46.533 21.52 72.126 16.868 24.041-4.653 40.91-13.185 50.607-25.593 9.693-12.408 14.542-32.962 14.542-61.657V800.372c0-24.044-8.336-44.403-25.012-61.075-16.672-16.676-37.03-25.012-61.074-25.012-23.267 0-43.237 8.336-59.912 25.012C8.339 755.969 0 776.327 0 800.372zm267.566 144.253c0 22.495 7.95 39.36 23.848 50.608 15.9 11.247 36.26 16.868 61.075 16.868 25.593 0 46.338-5.624 62.238-16.868 15.898-11.245 23.849-28.113 23.849-50.608V495.58c0-23.267-8.34-43.239-25.012-59.912-16.675-16.672-37.033-25.011-61.075-25.011-23.266 0-43.239 8.339-59.911 25.011-16.676 16.676-25.012 36.645-25.012 59.912zm266.403 37.227c0 22.492 8.143 39.36 24.43 50.607 16.286 11.245 37.226 16.869 62.822 16.869 24.816 0 45.174-5.624 61.072-16.869 15.9-11.247 23.851-28.115 23.851-50.607V601.442c0-24.041-8.339-44.595-25.012-61.657-16.675-17.061-36.644-25.59-59.911-25.59-24.044 0-44.595 8.529-61.657 25.59-17.061 17.062-25.593 37.616-25.593 61.657v717.775zm267.566 3.49c0 42.657 28.695 63.986 86.086 63.986 57.39 0 86.084-21.329 86.084-63.986V159.377c0-65.147-19.776-101.985-59.33-110.517-25.593-6.205-50.8 1.163-75.616 22.103-24.818 20.94-37.227 50.41-37.227 88.413v1163.331zm272.222 33.737V90.74c0-40.328 12.02-64.37 36.063-72.127C1161.78 6.205 1213.356 0 1264.543 0c118.657 0 229.176 27.92 331.547 83.76 102.373 55.84 185.165 132.038 248.37 228.594 63.21 96.56 99.854 203.001 109.936 319.337 47.308-20.165 97.717-30.247 151.23-30.247 108.578 0 201.452 38.39 278.618 115.17 77.168 76.782 115.754 169.072 115.754 276.875 0 108.578-38.586 201.256-115.754 278.036-77.166 76.78-169.651 115.17-277.455 115.17l-1012.097-1.163c-6.983-2.327-12.218-6.594-15.708-12.797s-5.227-11.638-5.227-16.291z"/>
            </svg>
            <span>SoundCloud</span>
          </button>
        </div>
      </div>
    </div>

    <div id="dashboard-section" class="dashboard-section hidden">

      <div class="meta-info fade-in">
        <h2 id="meta-title">...</h2>
        <p class="meta-line">
          <span id="meta-author" data-i18n="downloader.meta.defaultAuthor">Channel Name</span>
          <span class="meta-separator">-</span>
          <span id="meta-duration">00:00</span>
        </p>
      </div>

      <div class="path-selector fade-in">
        <input type="text" id="path-input" placeholder="No save path selected..." data-i18n-placeholder="downloader.path.placeholder" autocomplete="off">
        <button id="browse-btn" class="small-btn" title="Browse" data-i18n-title="downloader.path.browseTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </button>
      </div>

      <div class="preset-section fade-in" id="preset-section">
        <span class="option-label" data-i18n="downloader.options.presets">PRESETS</span>
        <div class="preset-grid" id="preset-grid"></div>
      </div>

      <div class="mode-switcher fade-in">
        <div class="switch-option active" data-mode="video" id="mode-video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
          <span data-i18n="downloader.mode.video">VIDEO</span>
        </div>
        <div class="switch-option" data-mode="audio" id="mode-audio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          <span data-i18n="downloader.mode.audio">AUDIO</span>
        </div>
      </div>

      <div id="options-wrapper" class="content-transition">
        <div class="options-grid fade-in">
          <div class="grid-column">
            <label data-i18n="downloader.options.format">FORMAT</label>
            <div class="tiles-container" id="format-list"></div>
          </div>
          <div class="grid-column">
            <label data-i18n="downloader.options.quality">QUALITY</label>
            <div class="tiles-container" id="quality-list"></div>
          </div>
        </div>
      </div>

      <div class="timeline-section fade-in">
        <div class="time-inputs">
          <input type="text" class="time-box" id="time-start" value="00:00:00">
          <div class="slider-track-container">
            <div class="track-bg"></div>
            <div class="track-fill" id="range-fill"></div>
            <input type="range" id="range-start" min="0" max="100" value="0">
            <input type="range" id="range-end" min="0" max="100" value="100">
          </div>
          <input type="text" class="time-box" id="time-end" value="00:05:30">
        </div>
      </div>

      <div class="extras-section fade-in">

        <div class="thumb-container">
          <span class="option-label" data-i18n="downloader.options.thumbnail">THUMBNAIL</span>
          <div class="thumb-preview">
            <span class="placeholder" data-i18n="downloader.options.preview">PREVIEW</span>
          </div>
          <div class="thumb-actions">
            <button class="icon-btn-small active" data-thumb="none" title="None" data-i18n-title="downloader.thumbnail.none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            </button>
            <button class="icon-btn-small" data-thumb="download" title="Save to file" data-i18n-title="downloader.thumbnail.saveToFile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="icon-btn-small" data-thumb="embed" title="Embed in video" data-i18n-title="downloader.thumbnail.embedInVideo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>
          </div>
        </div>

        <div class="option-group">
          <span class="option-label" data-i18n="downloader.options.other">OTHER</span>
          <div class="form-row">
            <input type="checkbox" id="geo-toggle" class="toggle-switch">
            <span style="font-size:0.85rem; color:#aaa;" data-i18n="downloader.options.geoBypass">Geo bypass</span>
          </div>
          <div class="form-row">
            <input type="checkbox" id="metadata-toggle" class="toggle-switch">
            <span style="font-size:0.85rem; color:#aaa;" data-i18n="downloader.options.embedMetadata">Embed metadata</span>
          </div>
          <div class="form-row video-only">
            <input type="checkbox" id="mute-audio-toggle" class="toggle-switch">
            <span style="font-size:0.85rem; color:#aaa;" data-i18n="downloader.options.muteAudio">Mute audio</span>
          </div>
          <div class="form-row advanced-only">
            <span class="toggle-text" data-i18n="downloader.options.customArgs">Custom args</span>
            <input type="text" id="custom-args-input" class="custom-args-input" placeholder="Optional" data-i18n-placeholder="downloader.options.customArgsPlaceholder" autocomplete="off">
          </div>
        </div>

        <div class="option-group subtitles-group" style="align-items: flex-end;">
          <span class="option-label" data-i18n="downloader.options.subtitles">SUBTITLES</span>
          <div class="form-row subtitles-row">
            <span class="toggle-text" data-i18n="downloader.options.downloadSubtitles">Download subtitles</span>
            <input type="checkbox" id="subs-toggle" class="toggle-switch">
          </div>
          <div class="form-row live-chat-row hidden" id="live-chat-row">
            <span class="toggle-text" data-i18n="downloader.options.downloadLiveChat">Download live chat</span>
            <input type="checkbox" id="chat-toggle" class="toggle-switch">
          </div>
          <div class="form-row embed-subs-row" id="embed-subs-row">
            <span class="toggle-text" data-i18n="downloader.options.embedSubtitles">Embed subtitles</span>
            <input type="checkbox" id="embed-subs-toggle" class="toggle-switch">
          </div>
          <div id="lang-wrapper" class="lang-input-wrapper">
            <input type="text" class="lang-input" placeholder="Code (optional)" data-i18n-placeholder="downloader.options.codeOptional" id="subs-lang" autocomplete="off">
          </div>
        </div>

      </div>

      <div class="action-footer fade-in">
        <button id="download-btn" class="big-action-btn" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="downloader.actions.download">DOWNLOAD</span>
        </button>
        <button id="queue-btn" class="big-action-btn" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span data-i18n="downloader.actions.addToQueue">ADD TO QUEUE</span>
        </button>
      </div>

    </div>

    <div id="search-results-section" class="search-results-section hidden">
      <div class="search-results-header fade-in">
        <h3 id="search-results-title" data-i18n="downloader.search.resultsTitle">SEARCH RESULTS</h3>
        <span id="search-results-count"></span>
      </div>
      <div id="search-results-grid" class="search-results-grid"></div>
    </div>
  </div>
</div>

<script src="assets/scripts/downloader.js"></script>
<script src="assets/scripts/search.js"></script>

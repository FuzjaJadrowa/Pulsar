<div class="page-root compressor-page">
  <div class="page-scroll app-scroll">
    <div id="compress-search-section" class="search-section centered compressor-zen">
      <div class="search-box-row compressor-bar" id="compressor-bar">
        <input type="text" id="compress-path-input" placeholder="Select file to compress..." data-i18n-placeholder="compressor.path.placeholder" autocomplete="off">
        <span id="compress-browse-btn" class="bar-icon" title="Browse" data-i18n-title="compressor.actions.browse" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <button id="compress-confirm-btn" class="bar-action">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
      <div class="drop-hint compress-drop-hint">
        <span class="drop-hint-icon" aria-hidden="true">
          <svg viewBox="0 0 512 512">
            <path d="M256 0c70.43 0 134.43 28.79 180.82 75.18S512 185.57 512 256s-28.79 134.43-75.18 180.82S326.43 512 256 512s-134.43-28.79-180.82-75.18S0 326.42 0 256 28.79 121.57 75.18 75.18 185.58 0 256 0m-90.15 260.79c-6.91-.29-11.82-2.6-14.65-6.9-7.7-11.53 2.81-22.93 10.09-30.95 20.68-22.68 71.32-77.2 81.53-89.21 7.73-8.54 18.74-8.54 26.46 0 10.54 12.31 63.74 69.32 83.39 91.38 6.82 7.68 15.25 18.15 8.15 28.78-2.9 4.31-7.75 6.61-14.66 6.9H304.2V364.5c0 11.07-9.08 20.17-20.16 20.17h-56.03c-11.08 0-20.16-9.08-20.16-20.17V260.79h-41.97ZM256 24.6c127.27 0 231.4 104.13 231.4 231.4S383.28 487.4 256 487.4 24.6 383.27 24.6 256 128.73 24.6 256 24.6" style="fill-rule:evenodd"/>
          </svg>
        </span>
        <span class="drop-hint-text" data-i18n="compressor.dropHint">or just drop a file</span>
        <span class="drop-hint-icon" aria-hidden="true">
          <svg viewBox="0 0 512 512">
            <path d="M256 0c70.43 0 134.43 28.79 180.82 75.18S512 185.57 512 256s-28.79 134.43-75.18 180.82S326.43 512 256 512s-134.43-28.79-180.82-75.18S0 326.42 0 256 28.79 121.57 75.18 75.18 185.58 0 256 0m-90.15 260.79c-6.91-.29-11.82-2.6-14.65-6.9-7.7-11.53 2.81-22.93 10.09-30.95 20.68-22.68 71.32-77.2 81.53-89.21 7.73-8.54 18.74-8.54 26.46 0 10.54 12.31 63.74 69.32 83.39 91.38 6.82 7.68 15.25 18.15 8.15 28.78-2.9 4.31-7.75 6.61-14.66 6.9H304.2V364.5c0 11.07-9.08 20.17-20.16 20.17h-56.03c-11.08 0-20.16-9.08-20.16-20.17V260.79h-41.97ZM256 24.6c127.27 0 231.4 104.13 231.4 231.4S383.28 487.4 256 487.4 24.6 383.27 24.6 256 128.73 24.6 256 24.6" style="fill-rule:evenodd"/>
          </svg>
        </span>
      </div>
    </div>

    <div id="compress-dashboard" class="compressor-dashboard hidden">
      <div class="compressor-info-card fade-in">
        <div class="compressor-name-row">
          <span id="compress-file-name" class="compressor-name-text" data-i18n="compressor.output.placeholder">File name</span>
          <input id="compress-file-name-input" class="compressor-name-input" type="text" placeholder="File name" data-i18n-placeholder="compressor.output.placeholder" autocomplete="off">
          <button type="button" id="compress-rename-btn" class="compressor-rename-btn" title="Edit file name" data-i18n-title="compressor.output.editTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
        <div class="compressor-category-row">
          <span id="compress-category-icon" class="compressor-category-icon"></span>
          <span id="compress-category-label" class="compressor-category-label">File</span>
        </div>
        <div class="compressor-meta-row">
          <div class="compressor-meta-item compressor-meta-location">
            <span class="compressor-meta-label" data-i18n="compressor.meta.locationLabel">Location</span>
            <span id="compress-file-location" class="compressor-meta-value compressor-meta-location-value">-</span>
          </div>
          <div class="compressor-meta-item">
            <span class="compressor-meta-label" data-i18n="compressor.meta.sizeLabel">Size</span>
            <span id="compress-file-size" class="compressor-meta-value">-</span>
          </div>
          <div class="compressor-meta-item compressor-meta-duration">
            <span class="compressor-meta-label" data-i18n="compressor.meta.durationLabel">Duration</span>
            <span id="compress-file-duration" class="compressor-meta-value">-</span>
          </div>
        </div>
      </div>

      <div id="compress-preset-section" class="preset-section fade-in hidden">
        <span class="option-label" data-i18n="downloader.options.presets">PRESETS</span>
        <div class="preset-grid" id="compress-preset-grid"></div>
      </div>

      <div class="compressor-controls-panel fade-in">
        <span class="option-label compressor-options-title" data-i18n="compressor.options.compressBy">COMPRESS BY</span>
        <div id="compress-mode-toggle" class="compressor-mode-toggle mode-switcher" role="group" aria-label="Compression mode">
          <button type="button" class="switch-option active" data-mode="percent" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M19 5 5 19"/>
              <circle cx="7" cy="7" r="3"/>
              <circle cx="17" cy="17" r="3"/>
            </svg>
            <span data-i18n="compressor.mode.percent">PERCENT</span>
          </button>
          <button type="button" class="switch-option" data-mode="size" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <ellipse cx="12" cy="6" rx="9" ry="3"/>
              <path d="M3 6v6c0 1.66 4.03 3 9 3s9-1.34 9-3V6"/>
              <path d="M3 12v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/>
            </svg>
            <span data-i18n="compressor.mode.size">SIZE</span>
          </button>
          <button type="button" class="switch-option" data-mode="quality" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m12 3.76 2.74 5.55 6.19.41-4.47 4.35 1.06 6.18L12 17.7l-5.52 2.55 1.07-6.18-4.48-4.35 6.19-.41z"/>
            </svg>
            <span data-i18n="compressor.mode.quality">QUALITY</span>
          </button>
        </div>

        <div class="compressor-mode-panels">
          <div class="compressor-mode-panel" data-mode="percent">
            <div class="compressor-percent-control">
              <div class="compressor-slider-track">
                <div class="track-bg"></div>
                <div class="track-fill" id="compress-percent-fill"></div>
                <input type="range" id="compress-percent-range" min="1" max="100" value="60" step="1" aria-label="Percent">
              </div>
              <input id="compress-percent-input" class="custom-input compressor-percent-input" type="number" min="1" max="100" value="60" autocomplete="off">
              <span class="compressor-percent-suffix">%</span>
            </div>
          </div>

          <div class="compressor-mode-panel hidden" data-mode="size">
            <div class="compressor-size-control">
              <input id="compress-size-input" class="custom-input" type="text" placeholder="Target size" data-i18n-placeholder="compressor.size.placeholder" autocomplete="off">
            </div>
          </div>

          <div class="compressor-mode-panel hidden" data-mode="quality">
            <div class="compressor-quality-control">
              <span class="compressor-crf-label">CRF</span>
              <select id="compress-crf-select" class="custom-select"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="compressor-options-panel fade-in">
        <span class="option-label compressor-options-title" data-i18n="compressor.options.title">OPTIONS</span>

        <div id="compress-save-path-panel" class="compressor-path-selector fade-in">
          <input type="text" id="compress-save-path-input" placeholder="Save path..." data-i18n-placeholder="compressor.options.pathPlaceholder" autocomplete="off">
          <button id="compress-save-path-browse" class="compressor-small-btn" title="Browse" data-i18n-title="compressor.actions.browse">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </button>
        </div>

        <div id="compress-specs-panel" class="compressor-specs-card fade-in">
          <div class="compressor-specs-grid">
            <div class="compressor-specs-column" data-side="output">
              <div class="compressor-specs-section" data-section="video">
                <div class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.estimatedSize">Estimated size</span>
                  <span id="compress-estimated-video-size" class="compressor-specs-value">-</span>
                </div>
                <label class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.videoCodec">Video codec</span>
                  <div class="compressor-specs-control">
                    <select id="compress-video-codec" class="custom-select">
                      <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                    </select>
                  </div>
                </label>
                <label class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.audioCodec">Audio codec</span>
                  <div class="compressor-specs-control">
                    <select id="compress-video-audio-codec" class="custom-select">
                      <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                    </select>
                  </div>
                </label>
              </div>

              <div class="compressor-specs-section" data-section="audio">
                <div class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.estimatedSize">Estimated size</span>
                  <span id="compress-estimated-audio-size" class="compressor-specs-value">-</span>
                </div>
                <label class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.audioCodec">Audio codec</span>
                  <div class="compressor-specs-control">
                    <select id="compress-audio-codec" class="custom-select">
                      <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                    </select>
                  </div>
                </label>
              </div>

              <div class="compressor-specs-section" data-section="image">
                <div class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.estimatedSize">Estimated size</span>
                  <span id="compress-estimated-image-size" class="compressor-specs-value">-</span>
                </div>
              </div>

              <div class="compressor-specs-section" data-section="other">
                <div class="compressor-specs-row">
                  <span class="compressor-specs-label" data-i18n="compressor.options.estimatedSize">Estimated size</span>
                  <span id="compress-estimated-other-size" class="compressor-specs-value">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="action-footer compressor-action-footer fade-in">
        <button id="compress-action-btn" class="big-action-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8.94 0h6.12c-2.06 9.33-2.28 14.67 0 24H8.94c2.19-9.33 2.15-14.67 0-24m.04 12.87L5.8 16.99l-1.77-1.42 1.82-2.44H0v-2.26h5.85L4.03 8.42 5.8 7l3.15 4.08c.53.68.57 1.09.03 1.79m6.02 0L18.19 17l1.77-1.42-1.82-2.44h5.85v-2.26h-5.86l1.82-2.45-1.77-1.42-3.15 4.08c-.53.68-.57 1.09-.03 1.79Z"/>
          </svg>
          <span data-i18n="compressor.actions.compress">COMPRESS</span>
        </button>
        <button id="compress-queue-btn" class="big-action-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span data-i18n="compressor.actions.addToQueue">ADD TO QUEUE</span>
        </button>
      </div>
    </div>

    <div id="compress-drop-overlay" class="compress-drop-overlay" aria-hidden="true">
      <div class="compress-drop-content">
        <div class="compress-drop-icon" aria-hidden="true">
          <svg viewBox="0 0 512 512"><path d="M256 0c70.43 0 134.43 28.79 180.82 75.18S512 185.57 512 256s-28.79 134.43-75.18 180.82S326.43 512 256 512s-134.43-28.79-180.82-75.18S0 326.42 0 256 28.79 121.57 75.18 75.18 185.58 0 256 0m-90.15 260.79c-6.91-.29-11.82-2.6-14.65-6.9-7.7-11.53 2.81-22.93 10.09-30.95 20.68-22.68 71.32-77.2 81.53-89.21 7.73-8.54 18.74-8.54 26.46 0 10.54 12.31 63.74 69.32 83.39 91.38 6.82 7.68 15.25 18.15 8.15 28.78-2.9 4.31-7.75 6.61-14.66 6.9H304.2V364.5c0 11.07-9.08 20.17-20.16 20.17h-56.03c-11.08 0-20.16-9.08-20.16-20.17V260.79h-41.97ZM256 24.6c127.27 0 231.4 104.13 231.4 231.4S383.28 487.4 256 487.4 24.6 383.27 24.6 256 128.73 24.6 256 24.6" style="fill-rule:evenodd"/></svg>
        </div>
        <div class="compress-drop-text" data-i18n="compressor.drop.text">Drop file to compress</div>
      </div>
    </div>

  </div>
</div>

<script src="../assets/scripts/compressor.js"></script>

<div class="page-root converter-page">
  <div class="page-scroll app-scroll">
    <div id="convert-search-section" class="search-section centered converter-zen">
      <div class="search-box-row converter-bar" id="converter-bar">
        <input type="text" id="convert-path-input" placeholder="Select a file to convert..." data-i18n-placeholder="converter.path.placeholder" autocomplete="off">
        <span id="convert-browse-btn" class="bar-icon" title="Browse" data-i18n-title="converter.actions.browse" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <button id="convert-confirm-btn" class="bar-action">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <div id="convert-dashboard" class="converter-dashboard hidden">
      <div class="converter-info-card fade-in">
        <div class="converter-name-row">
          <span id="convert-output-name-text" class="converter-name-text" data-i18n="converter.output.placeholder">Output name</span>
          <input id="convert-output-name-input" class="converter-name-input" type="text" placeholder="Output name" data-i18n-placeholder="converter.output.placeholder" autocomplete="off">
          <button type="button" id="convert-rename-btn" class="converter-rename-btn" title="Edit name" data-i18n-title="converter.output.editTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
        <div class="converter-category-row">
          <span id="convert-category-icon" class="converter-category-icon"></span>
          <span id="convert-category-label" class="converter-category-label">File</span>
        </div>
        <div class="converter-meta-row">
          <div class="converter-meta-item converter-meta-location">
            <span class="converter-meta-label" data-i18n="converter.meta.locationLabel">Location</span>
            <span id="convert-file-location" class="converter-meta-value converter-meta-location-value">-</span>
          </div>
          <div class="converter-meta-item">
            <span class="converter-meta-label" data-i18n="converter.meta.sizeLabel">Size</span>
            <span id="convert-file-size" class="converter-meta-value">-</span>
          </div>
          <div class="converter-meta-item converter-meta-duration">
            <span class="converter-meta-label" data-i18n="converter.meta.durationLabel">Duration</span>
            <span id="convert-file-duration" class="converter-meta-value">-</span>
          </div>
        </div>
      </div>

      <div class="converter-options-panel fade-in">
        <div class="converter-options-block">
          <span class="option-label converter-options-title" data-i18n="converter.options.convertTo">CONVERT TO</span>
          <div id="convert-media-toggle" class="converter-media-toggle hidden" data-mode="video" role="group" aria-label="Convert mode">
            <button type="button" class="converter-toggle-option active" data-mode="video" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><path d="M7 2v20M17 2v20M2 12h20"/></svg>
              <span data-i18n="converter.mode.video">VIDEO</span>
            </button>
            <button type="button" class="converter-toggle-option" data-mode="audio" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span data-i18n="converter.mode.audio">AUDIO</span>
            </button>
          </div>
          <div id="convert-format-grid" class="converter-format-grid content-transition"></div>
        </div>

        <div id="convert-details-panel" class="converter-details-panel hidden">
          <div id="convert-specs-panel" class="converter-specs-card fade-in">
            <div class="converter-specs-grid">
              <div class="converter-specs-column" data-side="output">
                <div class="converter-specs-column-title">Options</div>

                <div id="convert-save-path-panel" class="converter-path-selector fade-in">
                  <input type="text" id="convert-save-path-input" placeholder="Save path..." data-i18n-placeholder="converter.path.placeholder" autocomplete="off">
                  <button id="convert-save-path-browse" class="converter-small-btn" title="Browse" data-i18n-title="converter.actions.browse">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                  </button>
                </div>

                <div class="converter-specs-section" data-section="video">
                  <div class="converter-specs-row">
                    <span class="converter-specs-label">Estimated size</span>
                    <span id="convert-output-video-size" class="converter-specs-value">-</span>
                  </div>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Video quality</span>
                    <div class="converter-specs-control">
                      <select id="convert-output-video-quality" class="custom-select">
                        <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                        <option value="2160p">2160p</option>
                        <option value="1440p">1440p</option>
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                        <option value="360p">360p</option>
                        <option value="240p">240p</option>
                        <option value="144p">144p</option>
                      </select>
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Video codec</span>
                    <div class="converter-specs-control">
                      <select id="convert-output-video-codec" class="custom-select">
                        <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                      </select>
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Video bitrate</span>
                    <div class="converter-specs-control">
                      <input id="convert-output-video-bitrate" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.bitrate" placeholder="Auto" autocomplete="off">
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">FPS</span>
                    <div class="converter-specs-control">
                      <select id="convert-output-video-fps" class="custom-select">
                        <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                        <option value="60">60</option>
                        <option value="30">30</option>
                        <option value="24">24</option>
                      </select>
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Audio codec</span>
                    <div class="converter-specs-control">
                      <select id="convert-output-video-audio-codec" class="custom-select">
                        <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                      </select>
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Audio bitrate</span>
                    <div class="converter-specs-control">
                      <input id="convert-output-video-audio-bitrate" class="custom-input" type="text" placeholder="Auto" autocomplete="off">
                    </div>
                  </label>
                </div>

                <div class="converter-specs-section" data-section="audio">
                  <div class="converter-specs-row">
                    <span class="converter-specs-label">Estimated size</span>
                    <span id="convert-output-audio-size" class="converter-specs-value">-</span>
                  </div>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Audio codec</span>
                    <div class="converter-specs-control">
                      <select id="convert-output-audio-codec" class="custom-select">
                        <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                      </select>
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Audio bitrate</span>
                    <div class="converter-specs-control">
                      <input id="convert-output-audio-bitrate" class="custom-input" type="text" placeholder="Auto" autocomplete="off">
                    </div>
                  </label>
                </div>

                <div class="converter-specs-section" data-section="image">
                  <div class="converter-specs-row">
                    <span class="converter-specs-label">Estimated size</span>
                    <span id="convert-output-image-size" class="converter-specs-value">-</span>
                  </div>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Resolution</span>
                    <div class="converter-specs-control converter-resolution-inputs">
                      <input id="convert-output-image-width" class="custom-input" type="number" min="1" max="5000" placeholder="Width" autocomplete="off">
                      <span class="converter-resolution-sep">x</span>
                      <input id="convert-output-image-height" class="custom-input" type="number" min="1" max="5000" placeholder="Height" autocomplete="off">
                    </div>
                  </label>
                  <label class="converter-specs-row">
                    <span class="converter-specs-label">Quality</span>
                    <div class="converter-specs-control converter-percent-input">
                      <input id="convert-output-image-quality-range" class="converter-quality-range" type="range" min="1" max="100" value="100" step="1" aria-label="Quality">
                      <input id="convert-output-image-quality" class="custom-input" type="number" min="1" max="100" value="100" placeholder="100" autocomplete="off">
                      <span class="converter-percent-suffix">%</span>
                    </div>
                  </label>
                </div>

                <div class="converter-specs-section" data-section="other">
                  <div class="converter-specs-row">
                    <span class="converter-specs-label">Estimated size</span>
                    <span id="convert-output-other-size" class="converter-specs-value">-</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="action-footer converter-action-footer fade-in">
          <button id="convert-action-btn" class="big-action-btn" disabled>
            <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M7.288 48.34c.061.04.129.068.193.105.18.105.363.201.559.277.093.036.19.06.286.089.175.053.351.098.535.127.049.008.094.028.144.034q.238.027.476.028h.001q.401-.001.79-.08c.154-.031.297-.086.443-.134.101-.033.206-.054.304-.094.162-.067.31-.158.46-.245.075-.043.156-.075.228-.124a4 4 0 0 0 .604-.495l7.492-7.492a3.995 3.995 0 0 0-4.249-6.56c4.535-11.868 16.033-20.322 29.475-20.322 12.266 0 23.516 7.2 28.658 18.342a4 4 0 1 0 7.264-3.352C74.503 14.478 60.403 5.455 45.027 5.455c-17.837 0-32.947 11.873-37.859 28.129-1.224-1.611-3.48-2.084-5.247-1.008a4 4 0 0 0-1.338 5.496l5.481 9.007c.014.023.035.041.049.063q.189.291.424.545c.036.039.064.085.101.122q.297.3.65.531m82.128 3.589-5.48-9.008c-.014-.023-.035-.04-.049-.063a4 4 0 0 0-.424-.546c-.035-.039-.063-.084-.1-.121a4 4 0 0 0-.65-.531c-.061-.04-.129-.067-.192-.104a4 4 0 0 0-.56-.277c-.093-.036-.19-.06-.287-.089a4 4 0 0 0-.534-.127c-.049-.008-.095-.028-.144-.034-.07-.008-.138.003-.208-.001-.091-.007-.177-.028-.269-.028-.082 0-.159.019-.239.024q-.18.01-.36.036a4 4 0 0 0-.503.113c-.105.03-.209.058-.312.097a4 4 0 0 0-.509.243c-.082.045-.166.082-.245.133-.237.153-.46.326-.659.524l-.001.001-7.492 7.492a4 4 0 0 0 0 5.656 3.99 3.99 0 0 0 4.249.904c-4.535 11.868-16.033 20.321-29.475 20.321a31.505 31.505 0 0 1-29.068-19.268 4 4 0 0 0-7.368 3.117 39.49 39.49 0 0 0 36.436 24.151c17.831 0 32.937-11.864 37.854-28.111a4 4 0 0 0 3.176 1.574c.708 0 1.426-.188 2.075-.584a3.996 3.996 0 0 0 1.338-5.494" transform="translate(1.407 1.407)scale(2.81)"/>
            </svg>
            <span data-i18n="converter.actions.convert">CONVERT</span>
          </button>
          <button id="convert-queue-btn" class="big-action-btn" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="converter.actions.addToQueue">ADD TO QUEUE</span>
          </button>
        </div>
      </div>
    </div>

    <div id="convert-drop-overlay" class="convert-drop-overlay" aria-hidden="true">
      <div class="convert-drop-content">
        <div class="convert-drop-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 0c70.43 0 134.43 28.79 180.82 75.18S512 185.57 512 256s-28.79 134.43-75.18 180.82S326.43 512 256 512s-134.43-28.79-180.82-75.18S0 326.42 0 256 28.79 121.57 75.18 75.18 185.58 0 256 0m-90.15 260.79c-6.91-.29-11.82-2.6-14.65-6.9-7.7-11.53 2.81-22.93 10.09-30.95 20.68-22.68 71.32-77.2 81.53-89.21 7.73-8.54 18.74-8.54 26.46 0 10.54 12.31 63.74 69.32 83.39 91.38 6.82 7.68 15.25 18.15 8.15 28.78-2.9 4.31-7.75 6.61-14.66 6.9H304.2V364.5c0 11.07-9.08 20.17-20.16 20.17h-56.03c-11.08 0-20.16-9.08-20.16-20.17V260.79h-41.97ZM256 24.6c127.27 0 231.4 104.13 231.4 231.4S383.28 487.4 256 487.4 24.6 383.27 24.6 256 128.73 24.6 256 24.6" style="fill-rule:evenodd"/></svg>
        </div>
        <div class="convert-drop-text" data-i18n="converter.drop.text">Drop file to convert</div>
      </div>
    </div>

  </div>
</div>

<script src="assets/scripts/converter.js"></script>

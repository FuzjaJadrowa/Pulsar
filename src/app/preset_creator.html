<div class="preset-modal-overlay" id="preset-modal-overlay" aria-hidden="true">
  <div class="preset-modal" role="dialog" aria-modal="true">
    <div class="preset-modal-header">
      <div class="preset-modal-title" id="preset-modal-title" data-i18n="presetCreator.title.new">Create Preset</div>
      <button class="preset-modal-close" type="button" data-action="close" data-i18n-aria-label="presetCreator.actions.close" aria-label="Close">&times;</button>
    </div>

    <div class="preset-modal-body">
      <div class="preset-section">
        <div class="preset-section-title" data-i18n="presetCreator.sections.basic">Preset Details</div>
        <div class="preset-form-grid">
          <label class="preset-field">
            <span data-i18n="presetCreator.fields.title">Title</span>
            <input id="preset-title" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.title" placeholder="Preset title">
          </label>
          <label class="preset-field">
            <span data-i18n="presetCreator.fields.summary">Summary</span>
            <input id="preset-summary" class="custom-input" type="text" maxlength="50" data-i18n-placeholder="presetCreator.placeholders.summary" placeholder="Short description">
          </label>
        </div>

        <div class="preset-detail-row">
          <div class="preset-field preset-field-icon">
            <span data-i18n="presetCreator.fields.icon">Icon</span>
            <div class="preset-icon-drop" id="preset-icon-drop">
              <div class="preset-icon-preview" id="preset-icon-preview"></div>
              <div class="preset-icon-meta">
                <div class="preset-icon-title" data-i18n="presetCreator.icon.title">Drop icon here</div>
                <div class="preset-icon-hint" data-i18n="presetCreator.icon.hint">1:1 ratio, PNG/JPG/SVG</div>
                <button type="button" class="anim-btn preset-icon-browse" id="preset-icon-browse" data-i18n="presetCreator.icon.browse">Browse</button>
              </div>
              <input id="preset-icon-file" class="preset-icon-file" type="file" accept="image/*,.svg">
            </div>
          </div>

          <div class="preset-field preset-field-type">
            <span data-i18n="presetCreator.sections.type">Preset Type</span>
            <div class="preset-type-switcher">
              <button type="button" class="preset-choice active" data-preset-type="downloader">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span data-i18n="presetCreator.types.downloader">Downloader</span>
              </button>
              <button type="button" class="preset-choice" data-preset-type="converter">
                <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path d="M7.288 48.34c.061.04.129.068.193.105.18.105.363.201.559.277.093.036.19.06.286.089.175.053.351.098.535.127.049.008.094.028.144.034q.238.027.476.028h.001q.401-.001.79-.08c.154-.031.297-.086.443-.134.101-.033.206-.054.304-.094.162-.067.31-.158.46-.245.075-.043.156-.075.228-.124a4 4 0 0 0 .604-.495l7.492-7.492a3.995 3.995 0 0 0-4.249-6.56c4.535-11.868 16.033-20.322 29.475-20.322 12.266 0 23.516 7.2 28.658 18.342a4 4 0 1 0 7.264-3.352C74.503 14.478 60.403 5.455 45.027 5.455c-17.837 0-32.947 11.873-37.859 28.129-1.224-1.611-3.48-2.084-5.247-1.008a4 4 0 0 0-1.338 5.496l5.481 9.007c.014.023.035.041.049.063q.189.291.424.545c.036.039.064.085.101.122q.297.3.65.531m82.128 3.589-5.48-9.008c-.014-.023-.035-.04-.049-.063a4 4 0 0 0-.424-.546c-.035-.039-.063-.084-.1-.121a4 4 0 0 0-.65-.531c-.061-.04-.129-.067-.192-.104a4 4 0 0 0-.56-.277c-.093-.036-.19-.06-.287-.089a4 4 0 0 0-.534-.127c-.049-.008-.095-.028-.144-.034-.07-.008-.138.003-.208-.001-.091-.007-.177-.028-.269-.028-.082 0-.159.019-.239.024q-.18.01-.36.036a4 4 0 0 0-.503.113c-.105.03-.209.058-.312.097a4 4 0 0 0-.509.243c-.082.045-.166.082-.245.133-.237.153-.46.326-.659.524l-.001.001-7.492 7.492a4 4 0 0 0 0 5.656 3.99 3.99 0 0 0 4.249.904c-4.535 11.868-16.033 20.321-29.475 20.321a31.505 31.505 0 0 1-29.068-19.268 4 4 0 0 0-7.368 3.117 39.49 39.49 0 0 0 36.436 24.151c17.831 0 32.937-11.864 37.854-28.111a4 4 0 0 0 3.176 1.574c.708 0 1.426-.188 2.075-.584a3.996 3.996 0 0 0 1.338-5.494" transform="translate(1.407 1.407)scale(2.81)"/>
                </svg>
                <span data-i18n="presetCreator.types.converter">Converter</span>
              </button>
              <button type="button" class="preset-choice" data-preset-type="compressor">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M8.94 0h6.12c-2.06 9.33-2.28 14.67 0 24H8.94c2.19-9.33 2.15-14.67 0-24m.04 12.87L5.8 16.99l-1.77-1.42 1.82-2.44H0v-2.26h5.85L4.03 8.42 5.8 7l3.15 4.08c.53.68.57 1.09.03 1.79m6.02 0L18.19 17l1.77-1.42-1.82-2.44h5.85v-2.26h-5.86l1.82-2.45-1.77-1.42-3.15 4.08c-.53.68-.57 1.09-.03 1.79Z"/>
                </svg>
                <span data-i18n="presetCreator.types.compressor">Compressor</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="preset-section preset-format-section">
        <div class="preset-section-title" data-i18n="presetCreator.sections.format">Format</div>
        <div class="preset-format-input">
          <input id="preset-format" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.format" placeholder="Type format">
          <div id="preset-format-suggestions" class="preset-format-suggestions"></div>
        </div>
      </div>

      <div class="preset-section preset-compressor-section hidden" id="preset-compressor-section">
        <div class="preset-section-title" data-i18n="presetCreator.sections.compression">Compression</div>
        <div class="preset-compressor-toggle" id="preset-compressor-toggle" role="group" aria-label="Compression mode">
          <button type="button" class="preset-compressor-option active" data-mode="percent" aria-pressed="true">
            <span data-i18n="compressor.mode.percent">PERCENT</span>
          </button>
          <button type="button" class="preset-compressor-option" data-mode="size" aria-pressed="false">
            <span data-i18n="compressor.mode.size">SIZE</span>
          </button>
          <button type="button" class="preset-compressor-option" data-mode="quality" aria-pressed="false">
            <span data-i18n="compressor.mode.quality">QUALITY</span>
          </button>
        </div>
        <div class="preset-compressor-panels">
          <div class="preset-compressor-panel" data-mode="percent">
            <div class="preset-compressor-percent">
              <div class="preset-compressor-track">
                <div class="preset-compressor-fill" id="preset-compress-percent-fill"></div>
                <input type="range" id="preset-compress-percent-range" min="1" max="100" value="60" step="1" aria-label="Percent">
              </div>
              <input id="preset-compress-percent-input" class="custom-input preset-compressor-percent-input" type="number" min="1" max="100" value="60" autocomplete="off">
              <span class="preset-compressor-percent-suffix">%</span>
            </div>
          </div>
          <div class="preset-compressor-panel hidden" data-mode="size">
            <div class="preset-compressor-size">
              <input id="preset-compress-size-input" class="custom-input" type="text" placeholder="Target size" data-i18n-placeholder="compressor.size.placeholder" autocomplete="off">
            </div>
          </div>
          <div class="preset-compressor-panel hidden" data-mode="quality">
            <div class="preset-compressor-quality">
              <span class="preset-compressor-crf-label" data-i18n="presetCreator.fields.crf">CRF</span>
              <select id="preset-compress-crf-select" class="custom-select"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="preset-advanced" id="preset-advanced">
        <div class="preset-section">
          <div class="preset-section-title" data-i18n="presetCreator.sections.misc">Misc</div>
          <div class="preset-form-grid">
            <label class="preset-field preset-path-field">
              <span data-i18n="presetCreator.fields.path">Save path</span>
              <div class="preset-inline">
                <input id="preset-path" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.path" placeholder="Optional">
                <button type="button" class="anim-btn preset-browse-btn" id="preset-path-browse" data-i18n="presetCreator.actions.browse">Browse</button>
              </div>
            </label>
          </div>

          <div class="preset-toggle-grid" id="preset-toggle-grid">
            <div class="preset-toggle-line preset-toggle-line-subs">
              <div class="preset-toggle-item">
                <span data-i18n="presetCreator.toggles.downloadSubtitles">Download subtitles</span>
                <label class="switch"><input id="preset-download-subs" type="checkbox"><span class="slider"></span></label>
              </div>
              <div class="preset-toggle-item preset-subs-extra" id="preset-embed-subs-row">
                <span data-i18n="presetCreator.toggles.embedSubtitles">Embed subtitles</span>
                <label class="switch"><input id="preset-embed-subs" type="checkbox"><span class="slider"></span></label>
              </div>
              <div class="preset-toggle-item preset-toggle-code preset-subs-extra" id="preset-subs-code-row">
                <span data-i18n="presetCreator.toggles.subtitlesCode">Code (optional)</span>
                <input id="preset-subs-code" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.subtitlesCode" placeholder="en">
              </div>
            </div>
            <div class="preset-toggle-line">
              <div class="preset-toggle-item">
                <span data-i18n="presetCreator.toggles.embedMetadata">Embed metadata</span>
                <label class="switch"><input id="preset-embed-meta" type="checkbox"><span class="slider"></span></label>
              </div>
              <div class="preset-toggle-item">
                <span data-i18n="presetCreator.toggles.embedThumbnail">Embed thumbnail</span>
                <label class="switch"><input id="preset-embed-thumb" type="checkbox"><span class="slider"></span></label>
              </div>
              <div class="preset-toggle-item">
                <span data-i18n="presetCreator.toggles.geoBypass">Geo bypass</span>
                <label class="switch"><input id="preset-geo-bypass" type="checkbox"><span class="slider"></span></label>
              </div>
              <div class="preset-toggle-item" id="preset-mute-row">
                <span data-i18n="presetCreator.toggles.muteAudio">Mute audio</span>
                <label class="switch"><input id="preset-mute-audio" type="checkbox"><span class="slider"></span></label>
              </div>
            </div>
          </div>
        </div>

        <div class="preset-section preset-media-section">
          <div class="preset-section-title" data-i18n="presetCreator.sections.videoAudio">Video & Audio</div>

          <div class="preset-subsection preset-media-row" id="preset-video-section">
            <div class="preset-media-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
            </div>
            <div class="preset-media-grid preset-media-grid-video">
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.videoQuality">Video quality</span>
                <select id="preset-video-quality" class="custom-select">
                  <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                  <option value="best">Best</option>
                  <option value="2160p">2160p</option>
                  <option value="1440p">1440p</option>
                  <option value="1080p">1080p</option>
                  <option value="720p">720p</option>
                  <option value="480p">480p</option>
                  <option value="360p">360p</option>
                  <option value="240p">240p</option>
                  <option value="144p">144p</option>
                </select>
              </label>
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.videoCodec">Video codec</span>
                <select id="preset-video-codec" class="custom-select">
                  <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                </select>
              </label>
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.videoBitrate">Video bitrate</span>
                <input id="preset-video-bitrate" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.bitrate" placeholder="Auto">
              </label>
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.videoFps">FPS</span>
                <select id="preset-video-fps" class="custom-select">
                  <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                  <option value="60">60</option>
                  <option value="30">30</option>
                  <option value="24">24</option>
                </select>
              </label>
            </div>
          </div>

          <div class="preset-subsection preset-media-row" id="preset-audio-section">
            <div class="preset-media-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <div class="preset-media-grid preset-media-grid-audio">
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.audioSampleRate">Audio sample rate</span>
                <select id="preset-audio-sample" class="custom-select">
                  <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                  <option value="32000">32000</option>
                  <option value="44100">44100</option>
                  <option value="48000">48000</option>
                  <option value="96000">96000</option>
                </select>
              </label>
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.audioCodec">Audio codec</span>
                <select id="preset-audio-codec" class="custom-select">
                  <option value="" data-i18n="presetCreator.select.auto">Auto</option>
                </select>
              </label>
              <label class="preset-field">
                <span data-i18n="presetCreator.fields.audioBitrate">Audio bitrate</span>
                <input id="preset-audio-bitrate" class="custom-input" type="text" data-i18n-placeholder="presetCreator.placeholders.bitrate" placeholder="Auto">
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="preset-modal-footer">
      <button type="button" class="anim-btn preset-save-btn" id="preset-save-btn" data-i18n="presetCreator.actions.save">Save Preset</button>
      <button type="button" class="anim-btn preset-export-btn" id="preset-export-btn" data-i18n="presetCreator.actions.export">Export Preset</button>
    </div>
  </div>
</div>

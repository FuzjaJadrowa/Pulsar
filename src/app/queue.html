<div class="queue-panel-inner">
  <div class="queue-title" data-i18n="queue.title">Queue</div>

  <div class="queue-actions">
    <button class="queue-action queue-action-start" data-queue-action="start-all" data-i18n="queue.actions.startAll">Start all</button>
    <button class="queue-action queue-action-stop" data-queue-action="stop-all" data-i18n="queue.actions.stopAll">Stop all</button>
    <button class="queue-action" data-queue-action="clear-queue" data-i18n="queue.actions.clearQueue">Clear queue</button>
  </div>

  <div class="queue-items" id="queue-items"></div>

  <div class="queue-pagination hidden" id="queue-pagination">
    <button class="queue-page-btn" data-queue-action="prev-page" aria-label="Previous page" data-i18n-aria-label="queue.pagination.previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <span id="queue-page-label" data-i18n="queue.pagination.label">Page 1/1</span>
    <button class="queue-page-btn" data-queue-action="next-page" aria-label="Next page" data-i18n-aria-label="queue.pagination.next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</div>

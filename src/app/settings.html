<div class="settings-page" style="padding: 20px 40px; padding-bottom: 40px; overflow-y: auto;">

  <div class="settings-page-header">
    <span class="settings-page-title">Settings</span>
  </div>

  <section class="settings-section-card">
    <div class="settings-section-title">General</div>

    <div class="settings-item-row">
      <span>Theme</span>
      <select id="theme" class="custom-select" style="width: 150px;">
        <option value="System">System</option>
        <option value="Dark">Dark</option>
        <option value="Light">Light</option>
      </select>
    </div>

    <div class="settings-item-row">
      <span>Language</span>
      <select id="language" class="custom-select" style="width: 150px;">
        <option value="English">English</option>
      </select>
    </div>

    <div class="settings-inline-group">
      <div class="settings-inline-label">When I close Pulsar:</div>
      <div class="radio-group">
        <label class="custom-radio"><input type="radio" name="close_behavior" value="hide">Hide</label>
        <label class="custom-radio"><input type="radio" name="close_behavior" value="exit">Exit</label>
      </div>
    </div>
  </section>

  <section class="settings-section-card">
    <div class="settings-section-title">Requirements</div>

    <div class="settings-item-row">
      <span>Auto-update Pulsar</span>
      <label class="switch"><input id="update_app" type="checkbox"><span class="slider"></span></label>
    </div>
    <div class="settings-item-row">
      <span>Auto-update yt-dlp</span>
      <label class="switch"><input id="update_ytdlp" type="checkbox"><span class="slider"></span></label>
    </div>
    <div class="settings-item-row">
      <span>Auto-update FFmpeg</span>
      <label class="switch"><input id="update_ffmpeg" type="checkbox"><span class="slider"></span></label>
    </div>
  </section>

  <section class="settings-section-card">
    <div class="settings-section-title">Download settings</div>

    <div class="settings-item-row">
      <span>Cookies from browser</span>
      <select id="cookies_browser" class="custom-select" style="width: 150px;">
        <option value="None">None</option>
        <option value="Brave">Brave</option>
        <option value="Chrome">Chrome</option>
        <option value="Chromium">Chromium</option>
        <option value="Edge">Edge</option>
        <option value="Firefox">Firefox</option>
        <option value="Opera">Opera</option>
        <option value="Safari">Safari</option>
        <option value="Vivaldi">Vivaldi</option>
        <option value="Whale">Whale</option>
      </select>
    </div>
  </section>

  <section class="settings-section-card">
    <div class="settings-section-title">Support</div>

    <div class="settings-item-row">
      <span>Show your support!</span>
      <button class="anim-btn" style="background: #E91E63; color: white; padding: 10px 20px;" onclick="window.__TAURI__.opener.openUrl('https://tipply.pl/@fuzjajadrowa')">
        Support Project
      </button>
    </div>
  </section>
</div>

<script src="assets/scripts/settings.js"></script>
